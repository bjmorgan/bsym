[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bsym"
dynamic = ["version"]
description = "A Basic Symmetry Module"
readme = "README.md"
authors = [
    {name = "Benjamin J. Morgan", email = "b.j.morgan@bath.ac.uk"},
]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pymatgen",
    "tqdm",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx_rtd_theme>=1.0.0",
    "nbsphinx>=0.8.9",
    "ipykernel>=6.0.0",
    "matplotlib>=3.4.0",
    "pypandoc>=1.5",
    "myst-parser",
    "myst-nb",
]

[project.urls]
"Homepage" = "https://github.com/bjmorgan/bsym"
"Bug Tracker" = "https://github.com/bjmorgan/bsym/issues"
"Source Code" = "https://github.com/bjmorgan/bsym"

[tool.setuptools]
packages = ["bsym", "bsym.interface"]

[tool.setuptools.dynamic]
version = {attr = "bsym.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
]

[tool.coverage.run]
source = ["bsym"]
omit = [
    "*/python?.?/*",
    "*/lib-python/?.?/*.py",
    "*/lib_pypy/_*.py",
    "*/site-packages/ordereddict.py",
    "*/site-packages/nose/*",
    "*/unittest2/*",
    "docs",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
